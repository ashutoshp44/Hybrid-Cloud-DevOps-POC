name: Deploy Application to Linux EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application source code
        uses: actions/checkout@v4

      - name: Build application
        shell: bash
        run: |
          echo "Starting application build..."

          mkdir -p build
          cp app/index.html build/index.html

          echo "Build completed successfully."
          ls -la build

      - name: Test application
        shell: bash
        run: |
          echo "Running application tests..."

          test -f build/index.html

          grep -q "Hybrid Cloud DevOps" build/index.html

          echo "Application tests passed successfully."

      - name: Package application
        shell: bash
        run: |
          echo "Creating deployment package..."

          tar -czf application.tar.gz -C build index.html

          echo "Package created successfully."
          ls -lh application.tar.gz

      - name: Check runner environment
        shell: bash
        run: |
          echo "User: $(whoami)"
          echo "Home: $HOME"
          echo "Shell: $SHELL"
          echo "Working directory: $(pwd)"
          echo "Runner temp: $RUNNER_TEMP"
          ls -la

      - name: Install SSH key
        shell: bash
        run: |
          SSH_DIR="$RUNNER_TEMP/ssh"

          mkdir -p "$SSH_DIR"

          echo "${{ secrets.EC2_SSH_KEY }}" > "$SSH_DIR/hybrid-cloud-key.pem"
          chmod 600 "$SSH_DIR/hybrid-cloud-key.pem"

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" > "$SSH_DIR/known_hosts"

          echo "SSH setup completed."

      - name: Backup current application
        shell: bash
        run: |
          SSH_DIR="$RUNNER_TEMP/ssh"

          ssh \
            -i "$SSH_DIR/hybrid-cloud-key.pem" \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "sudo cp /usr/share/nginx/html/index.html /usr/share/nginx/html/index.html.backup"

          echo "Current application backed up successfully."

      - name: Deploy application
        shell: bash
        run: |
          SSH_DIR="$RUNNER_TEMP/ssh"

          scp \
            -i "$SSH_DIR/hybrid-cloud-key.pem" \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o StrictHostKeyChecking=yes \
            application.tar.gz \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/application.tar.gz"

          ssh \
            -i "$SSH_DIR/hybrid-cloud-key.pem" \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "rm -rf /tmp/deployment && mkdir -p /tmp/deployment && tar -xzf /tmp/application.tar.gz -C /tmp/deployment && sudo cp /tmp/deployment/index.html /usr/share/nginx/html/index.html && sudo systemctl restart nginx"

          echo "Application deployed successfully."

      - name: Verify application
        shell: bash
        run: |
          SSH_DIR="$RUNNER_TEMP/ssh"

          ssh \
            -i "$SSH_DIR/hybrid-cloud-key.pem" \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "curl -f http://localhost/"

          echo "Application verification successful."

      - name: Rollback application
        if: ${{ failure() }}
        shell: bash
        run: |
          SSH_DIR="$RUNNER_TEMP/ssh"

          echo "Deployment or verification failed."
          echo "Starting automatic rollback..."

          ssh \
            -i "$SSH_DIR/hybrid-cloud-key.pem" \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "if [ -f /usr/share/nginx/html/index.html.backup ]; then sudo cp /usr/share/nginx/html/index.html.backup /usr/share/nginx/html/index.html && sudo systemctl restart nginx; else echo 'Backup file not found'; exit 1; fi"

          echo "Rollback completed successfully."

      - name: Verify rollback
        if: ${{ failure() }}
        shell: bash
        run: |
          SSH_DIR="$RUNNER_TEMP/ssh"

          echo "Verifying rollback..."

          ssh \
            -i "$SSH_DIR/hybrid-cloud-key.pem" \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "curl -f http://localhost/"

          echo "Rollback verification completed."