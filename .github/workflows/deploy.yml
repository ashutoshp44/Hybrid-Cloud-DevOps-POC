name: Deploy Application to Linux EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application source code
        uses: actions/checkout@v4

      - name: Check runner environment
        shell: bash
        run: |
          echo "User: $(whoami)"
          echo "Home: $HOME"
          echo "Shell: $SHELL"
          pwd
          ls -la

            - name: Diagnose GitHub runner
        shell: bash
        run: |
          echo "=== Runner information ==="
          echo "User: $(whoami)"
          echo "HOME: $HOME"
          echo "RUNNER_TEMP: $RUNNER_TEMP"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "PWD: $(pwd)"
          echo "Shell: $SHELL"

          echo "=== Environment ==="
          env | sort | grep -E '^(HOME|RUNNER_|GITHUB_WORKSPACE|SHELL)=' || true

          echo "=== Directory checks ==="
          ls -ld "$HOME" || true
          ls -ld "$RUNNER_TEMP" || true
          ls -ld "$GITHUB_WORKSPACE" || true

          echo "=== Temp directory test ==="
          TEST_DIR="$RUNNER_TEMP/ssh-test"
          echo "Testing: $TEST_DIR"
          mkdir -pv "$TEST_DIR"
          ls -ld "$TEST_DIR"

      - name: Deploy application
        shell: bash
        run: |
          scp -i "$RUNNER_TEMP/ssh/hybrid-cloud-key.pem"
            app/index.html \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/index.html"

          ssh -i "$HOME/.ssh/hybrid-cloud-key.pem" \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "sudo cp /tmp/index.html /usr/share/nginx/html/index.html && sudo systemctl restart nginx"

      - name: Verify application
        shell: bash
        run: |
          ssh -i "$RUNNER_TEMP/ssh/hybrid-cloud-key.pem" \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "curl -f http://localhost/"