name: Deploy Application to Linux EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application source code
        uses: actions/checkout@v4

      - name: Check runner environment
        shell: bash
        run: |
          echo "User: $(whoami)"
          echo "Home: $HOME"
          echo "Shell: $SHELL"
          echo "Working directory: $(pwd)"
          echo "Runner temp: $RUNNER_TEMP"
          ls -la

      - name: Install SSH key
        shell: bash
        run: |
          echo "STEP 1: Checking runner variables"
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          echo "HOME=$HOME"

          echo "STEP 2: Creating SSH directory"
          SSH_DIR="$RUNNER_TEMP/ssh"
          mkdir -pv "$SSH_DIR"
          echo "mkdir exit code: $?"

          echo "STEP 3: Writing SSH key"
          echo "${{ secrets.EC2_SSH_KEY }}" > "$SSH_DIR/hybrid-cloud-key.pem"
          echo "write key exit code: $?"

          echo "STEP 4: Setting permissions"
          chmod 600 "$SSH_DIR/hybrid-cloud-key.pem"
          echo "chmod exit code: $?"

          echo "STEP 5: Checking key file"
          ls -la "$SSH_DIR"

          echo "STEP 6: Testing SSH key"
          ssh-keygen -y -f "$SSH_DIR/hybrid-cloud-key.pem" > /dev/null
          echo "ssh-keygen exit code: $?"

          echo "STEP 7: SSH setup completed"

      - name: Deploy application
        shell: bash
        run: |
          SSH_DIR="$RUNNER_TEMP/ssh"

          scp -i "$SSH_DIR/hybrid-cloud-key.pem" \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            app/index.html \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/index.html"

          ssh -i "$SSH_DIR/hybrid-cloud-key.pem" \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "sudo cp /tmp/index.html /usr/share/nginx/html/index.html && sudo systemctl restart nginx"

      - name: Verify application
        shell: bash
        run: |
          SSH_DIR="$RUNNER_TEMP/ssh"

          ssh -i "$SSH_DIR/hybrid-cloud-key.pem" \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "curl -f http://localhost/"