name: Deploy Application to Linux EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application source code
        uses: actions/checkout@v4

      - name: Check runner environment
        shell: bash
        run: |
          echo "User: $(whoami)"
          echo "Home: $HOME"
          echo "Shell: $SHELL"
          pwd
          ls -la

      - name: Install SSH key
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.ssh"
          echo "${{ secrets.EC2_SSH_KEY }}" > "$HOME/.ssh/hybrid-cloud-key.pem"
          chmod 600 "$HOME/.ssh/hybrid-cloud-key.pem"
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> "$HOME/.ssh/known_hosts"

      - name: Deploy application
        shell: bash
        run: |
          scp -i "$HOME/.ssh/hybrid-cloud-key.pem" \
            app/index.html \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/index.html"

          ssh -i "$HOME/.ssh/hybrid-cloud-key.pem" \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "sudo cp /tmp/index.html /usr/share/nginx/html/index.html && sudo systemctl restart nginx"

      - name: Verify application
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/hybrid-cloud-key.pem" \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "curl -f http://localhost/"